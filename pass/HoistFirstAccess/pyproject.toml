[build-system]
requires = ["scikit-build-core>=0.10", "cmake>=3.20", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "triton-mega-hoist-first-access"
version = "0.1.0"
description = "HoistFirstAccess: a Triton pass prefetching first-access loads across a grid-wide barrier, distributed as a Plugin"
requires-python = ">=3.9"

[tool.triton-ext]
status = "experimental"
enabled = true

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
# Keep caches out of the wheel.
wheel.exclude = ["**/__pycache__/**", "**/*.pyc"]

# Bundle the pure-Python package. CMake installs
# libmega_hoist_first_access.so into triton_mega_hoist_first_access/ using
# `install()` (see CMakeLists.txt).
[tool.scikit-build.wheel.packages]
triton_mega_hoist_first_access = "python/triton_mega_hoist_first_access"
