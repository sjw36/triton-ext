# tlM is a pure-Python language extension: it emits `mega` dialect ops through
# builder methods the `triton-mega` plugin registers, and compiles nothing of
# its own. There is no CMakeLists.txt, so it builds with setuptools rather than
# scikit-build-core (which the compiled extensions use).
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-tlM"
version = "0.1.0"
description = "tlM: a Triton language extension emitting the mega dialect, distributed as a Plugin"
requires-python = ">=3.9"

[tool.triton-ext]
status = "experimental"
enabled = true

# `import tlM` requires `triton_mega` (the dialect + builder method it emits
# through). That is not declared as a wheel dependency: like every other
# extension here, the plugins it needs are expected to be installed alongside
# it — `make install` at the repo root does that in path order, dialects first.
[tool.setuptools]
package-dir = { "" = "python" }
packages = ["tlM"]
